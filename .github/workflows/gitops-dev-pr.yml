name: GitOps Dev Dry-Run

on:
  pull_request:
    paths:
      - 'base/**'
      - 'overlays/dev/**'

jobs:
  validate-kustomize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Dry Run Kustomize Render
        run: |
          kustomize build overlays/dev