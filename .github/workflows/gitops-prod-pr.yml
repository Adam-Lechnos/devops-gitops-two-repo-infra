name: GitOps Production Promotion PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to promote to PROD (e.g., 1.1.4)'
        required: true
        type: string

jobs:
  promote-prod:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update Prod Kustomization Image Tag
        run: |
          cd k8s/overlays/prod
          kustomize edit set image ghcr.io/adam-lechnos/python_app_learn=ghcr.io/adam-lechnos/python_app_learn:${{ inputs.version }}

      - name: Create Pull Request to Promote to Production
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          commit-message: "chore(gitops): promote release ${{ inputs.version }} to PRODUCTION"
          branch: "gitops/promote-prod-${{ inputs.version }}"
          title: "🚨 PROMOTE TO PRODUCTION: Release ${{ inputs.version }}"
          body: |
            ### 🛑 Production Promotion Request
            This PR updates the **Production** Kustomize overlay image tag to **`${{ inputs.version }}`**.
            
            * **Environment:** Production (`prod`)
            * **Target Version:** `${{ inputs.version }}`
            * **Action Required:** Strict code review, verification that QA testing passed, and explicit manager/lead approval prior to merge.
          sign-commits: true