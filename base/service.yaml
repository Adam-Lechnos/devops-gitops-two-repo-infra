apiVersion: v1
kind: Service
metadata:
  name: python-app-service
spec:
  type: NodePort # Exposes the service on a port across the cluster nodes
  selector:
    app: python-app
  ports:
  - protocol: TCP
    port: 5000 # The port the service listens on inside the cluster
    targetPort: 5000 # The port your container app is actually running on
