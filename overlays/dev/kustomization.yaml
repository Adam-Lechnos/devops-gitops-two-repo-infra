apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- '../../base'

namespace: dev

images:
- name: ghcr.io/adam-lechnos/devops-gitops-two-repo-src
  newTag: latest

# 1. Generate the ConfigMap automatically with a content hash suffix
configMapGenerator:
- name: app-env-config
  literals:
  - FLASK_ENV="dev"
  - CUSTOM_MESSAGE="Your CD portion of the pipeline worked DEV!"

patches:
- path: patch-env.yaml
