apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: prod

images:
- name: ghcr.io/adam-lechnos/devops-gitops-two-repo-src
  newName: ghcr.io/adam-lechnos/devops-gitops-two-repo-src
  newTag: v1.0.0

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3  # Production needs higher availability!
  target:
    kind: Deployment
    name: python-app
