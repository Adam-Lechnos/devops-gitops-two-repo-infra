apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: qa

images:
- name: ghcr.io/adam-lechnos/devops-gitops-two-repo-src
  newTag: 1.0.0

# Example: Increase replicas in QA without touching the base deployment file
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: python-app
